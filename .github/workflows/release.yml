name: Test and release

# Every push and pull request: install the skill's engines and run its self-test.
# Release: Actions tab > "Test and release" > Run workflow. It publishes the version at
# the top of CHANGELOG.md (stamping today's date if it says "unreleased") as tag vX.Y.Z,
# with that section as the notes and openscad.skill attached.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Set up the skill
        run: |
          set -o pipefail
          bash openscad/scripts/setup.sh 2>&1 | tee setup.txt || { tail -5 setup.txt | sed 's/^/::error::/'; exit 1; }
      - name: Self-test
        run: |
          python3 openscad/scripts/asm.py --selftest > selftest.txt 2>&1; rc=$?
          cat selftest.txt
          { echo '### Self-test'; echo '```'; cat selftest.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ $rc -ne 0 ]; then
            grep -E "FAIL|Error|error|could not|Traceback|needs" selftest.txt | head -15 | sed 's/^/::error::/'
            tail -3 selftest.txt | sed 's/^/::error::/'
          fi
          exit $rc

  release:
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Read the version
        id: v
        run: |
          head=$(grep -m1 -E '^## [0-9]+\.[0-9]+(\.[0-9]+)?' CHANGELOG.md)
          ver=$(echo "$head" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
          [ -n "$ver" ] || { echo "::error::No '## X.Y.Z' heading at the top of CHANGELOG.md"; exit 1; }
          if git ls-remote --tags origin | grep -qiE "refs/tags/v$ver\$"; then
            echo "::error::v$ver is already released. Add a new section at the top of CHANGELOG.md first."; exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if echo "$head" | grep -qi unreleased; then echo "stamp=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Date the CHANGELOG entry
        if: steps.v.outputs.stamp == 'yes'
        run: |
          sed -i "0,/^## ${{ steps.v.outputs.version }} - unreleased/s//## ${{ steps.v.outputs.version }} - $(date -u +%Y-%m-%d)/" CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release ${{ steps.v.outputs.version }}"
          git push origin HEAD:main
      - name: Build the skill file and notes
        run: |
          zip -qr openscad.skill openscad -x '*/__pycache__/*'
          awk -v v="${{ steps.v.outputs.version }}" '
            $0 ~ "^## " v "( |$)" {on=1; next}
            on && /^## / {exit}
            on {print}' CHANGELOG.md > notes.md
          printf '\n**Install:** download `openscad.skill` below and upload it in Claude under Customize > Skills (replacing any older version). For Claude Code: `npx skills add %s --skill openscad`.\n' "$GITHUB_REPOSITORY" >> notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" openscad.skill \
            --title "OpenSCAD skill ${{ steps.v.outputs.version }}" \
            --notes-file notes.md --target "$(git rev-parse HEAD)"
